name: Composite build test

on:
  workflow_dispatch:
    inputs:
      example-ref:
        description: "jenkins-pipeline-shared-library-example branch/SHA to test against (default: main)"
        default: ""

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    name: Composite build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      DEVELOCITY_PUBLISH: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: jenkins-pipeline-shared-libraries-gradle-plugin

      - name: Resolve example ref
        id: example-ref
        env:
          OVERRIDE: ${{ inputs.example-ref }}
        run: |
          REF="${OVERRIDE:-main}"
          printf 'ref<<EOF\n%s\nEOF\n' "$REF" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: mkobit/jenkins-pipeline-shared-library-example
          ref: ${{ steps.example-ref.outputs.ref }}
          path: example

      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          java-version: 17
          distribution: temurin

      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92

      - name: Build
        working-directory: example
        run: ./gradlew --include-build ../jenkins-pipeline-shared-libraries-gradle-plugin build --continue
